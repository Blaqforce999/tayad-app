# Local Supabase config for Tayad AI. Trimmed to what the project uses.
# Full reference: https://supabase.com/docs/guides/local-development/cli/config
# If a newer CLI rejects a key here, run `supabase init --force` to regenerate
# and re-apply the Tayad-specific bits (auth.site_url, the deep-link redirect,
# the Google/Apple providers).

project_id = "tayad"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Match the remote project's Postgres version (SHOW server_version; on the remote).
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
# The mobile deep-link scheme (expo.scheme in app.json). OAuth and magic links
# redirect back into the app through this.
site_url = "tayad://"
additional_redirect_urls = ["tayad://", "exp://127.0.0.1:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
# Local dev only. Production requires email confirmation.
enable_confirmations = false

# Social sign-in. Disabled locally; fill client IDs and set the secret env vars
# to enable. See .agents/rules/security.md.
[auth.external.google]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = true

[auth.external.apple]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2
